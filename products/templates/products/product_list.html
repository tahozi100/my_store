<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجري الإلكتروني</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f9f9f9; }
        h1 { color: #333; text-align: center; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 220px; text-align: center; text-decoration: none; color: inherit; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { max-width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>مرحباً بك في المتجر الإلكتروني</h1>
    <div class="container">
        {% for product in products %}
            <a href="{% url 'product_detail' product.pk %}" class="card">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                    <div style="height: 160px; background: #eee; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: #888;">بدون صورة</div>
                {% endif %}
                <h3>{{ product.name }}</h3>
                <p>{{ product.description }}</p>
                <p class="price">{{ product.price }} جنيه</p>
            </a>
        {% empty %}
            <p>لا توجد منتجات حالياً.</p>
        {% endfor %}
    </div>
</body>
</html>
